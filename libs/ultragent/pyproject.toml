[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultragent"
description = "Thin config and option registry wrap around Deep Agents create_deep_agent"
license = { text = "MIT" }
readme = "README.md"
version = "0.0.1"
requires-python = ">=3.11,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.7.0,<0.8.0",
    "langchain>=1.4.5,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ultragent"]

[project.urls]
Homepage = "https://github.com/24601/ultragent/tree/main/libs/ultragent"
Repository = "https://github.com/24601/ultragent"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov",
    "pytest-socket",
    "pytest-xdist",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20,<1.0.0",
    "ty>=0.0.54,<1.0.0",
]

[tool.uv.sources]
deepagents = { path = "../deepagents", editable = true }

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["../deepagents"]

[tool.ty.rules]
division-by-zero = "error"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "ANN401",
]
extend-safe-fixes = ["PLR6201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google\\.genai\\.types",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D", "S101", "PLC0415"]
